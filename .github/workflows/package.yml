name: Validate and package Project Ember

on:
  push:
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
      - name: Validate project structure
        run: |
          test -f project_ember/project.godot
          test -d project_ember/scenes
          test -d project_ember/scripts
          test -f project_ember/tests/campaign_smoke_test.gd
      - name: Import and parse all Godot scripts (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --editor --path project_ember --quit 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during import." >&2
            exit 1
          fi
      - name: Smoke-test strategic map startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --quit-after 10 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during strategic startup." >&2
            exit 1
          fi
      - name: Smoke-test tactical battle startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember res://scenes/combat_test.tscn --quit-after 10 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during tactical startup." >&2
            exit 1
          fi
      - name: Test campaign economy, recruitment, expansion and persistence
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/campaign_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Campaign logic tests reported an error." >&2
            exit 1
          fi
      - name: Upload ready-to-open Godot project
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.5.3
          path: |
            project_ember/**
            !project_ember/.godot/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30