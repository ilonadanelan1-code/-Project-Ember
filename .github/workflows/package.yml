name: Validate and package Project Ember

on:
  push:
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
      - name: Validate project structure
        run: |
          test -f project_ember/project.godot
          test -d project_ember/scenes
          test -d project_ember/scripts
          test -f project_ember/tests/campaign_smoke_test.gd
          test -f project_ember/tests/unit_roster_smoke_test.gd
          test -f project_ember/tests/hero_progression_smoke_test.gd
          test -f project_ember/tests/diplomacy_smoke_test.gd
          test -f project_ember/tools/qa/run_smoke_tests.sh
          test -f project_ember/scripts/unit_catalog.gd
      - name: Restore licensed Tiny Swords atlas from the audited release (CI workspace only)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ember-release"
          gh release download v0.38.2 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "Project-Ember-v0.38.2-Godot-Audited.zip" \
            --dir "$RUNNER_TEMP/ember-release"
          python3 - "$RUNNER_TEMP/ember-release/Project-Ember-v0.38.2-Godot-Audited.zip" <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib
          import sys

          archive_path = Path(sys.argv[1])
          expected = {
              "combat_units_atlas.png": "ee07ed04f8856859af89590f3412b5865959d9ac19bd2f669268778eed45cf00",
              "atlas_manifest.json": "ff3b8b74ccf36c4c1cbc3d800acae42a9bbf047c774689fbec39073e81e95c2b",
          }
          target = Path("project_ember/assets/combat/tiny_swords")
          target.mkdir(parents=True, exist_ok=True)
          with ZipFile(archive_path) as zf:
              for name, digest in expected.items():
                  matches = [item for item in zf.namelist() if item.endswith(f"assets/combat/tiny_swords/{name}")]
                  if len(matches) != 1:
                      raise SystemExit(f"Expected one {name} in playable release; found {len(matches)}")
                  data = zf.read(matches[0])
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != digest:
                      raise SystemExit(f"SHA-256 mismatch for {name}: {actual}")
                  (target / name).write_bytes(data)
                  print(f"Restored {name} in CI workspace only; sha256={actual}")
          PY
      - name: Run static QA validation
        shell: bash
        run: |
          set -euo pipefail
          python3 project_ember/tools/qa/static_validate.py

      - name: Import and parse all Godot scripts (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --editor --path project_ember --quit 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during import." >&2
            exit 1
          fi
      - name: Smoke-test strategic map startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --quit-after 10 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during strategic startup." >&2
            exit 1
          fi
      - name: Smoke-test tactical battle startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember res://scenes/combat_test.tscn --quit-after 10 2>&1 | tee "$log_file"
          # Godot 4.3 has a confirmed dummy-renderer shutdown bug that emits
          # "Parameter \"m\" is null" for MeshInstance3D in headless mode.
          # Ignore only that exact engine signature; all other errors still fail CI.
          reported_errors="$(grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file" | grep -Fv 'ERROR: Parameter "m" is null.' || true)"
          if [ -n "$reported_errors" ]; then
            printf '%s\n' "$reported_errors" >&2
            echo "Godot reported an unexpected engine or script error during tactical startup." >&2
            exit 1
          fi
      - name: Test campaign economy, recruitment, expansion and persistence
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/campaign_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Campaign logic tests reported an error." >&2
            exit 1
          fi
      - name: Test unit roster, unlocks and combat profiles
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/unit_roster_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Unit roster tests reported an error." >&2
            exit 1
          fi
      - name: Test hero progression and commander abilities
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/hero_progression_smoke_test.gd 2>&1 | tee "$log_file"
          # Godot 4.3 dummy-renderer shutdown can emit the same confirmed
          # MeshInstance3D cleanup warning seen in the tactical startup test.
          # Ignore only that exact signature; all script and test errors still fail CI.
          reported_errors="$(grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file" | grep -Fv 'ERROR: Parameter "m" is null.' || true)"
          if [ -n "$reported_errors" ]; then
            printf '%s\\n' "$reported_errors" >&2
            echo "Hero progression tests reported an unexpected error." >&2
            exit 1
          fi
      - name: Run the complete GDScript parser and smoke-test suite
        shell: bash
        env:
          GODOT_BIN: godot
          EMBER_QA_ARTIFACTS: ${{ runner.temp }}/ember-smoke
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          bash project_ember/tools/qa/run_smoke_tests.sh project_ember 2>&1 | tee "$log_file"
          if ! grep -q "PASS parser checks" "$log_file"; then
            echo "The full project-context GDScript parser did not report success." >&2
            exit 1
          fi
          if ! grep -Eq 'Smoke tests: [0-9]+ passed / 0 failed / [0-9]+ total' "$log_file"; then
            echo "The complete smoke-test suite did not pass." >&2
            exit 1
          fi

      - name: Assemble source ZIP when licensed combat atlas is absent
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') == '' || hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') == '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cat > dist/BUILD-LIMITATIONS.txt <<'EOF'
          Project Ember v0.38.2 — source-only archive
          This package contains the Godot project code and tracked assets from GitHub.
          It is not a complete playable release: the licensed Tiny Swords runtime atlas
          and atlas_manifest.json are excluded from the public source repository.
          Restore the owner-provided Tiny Swords (Free Pack) ZIP and run:
          bash project_ember/tools/assets/package_playable_release.sh
          EOF
          zip -qr dist/Project-Ember-v0.38.2-source.zip project_ember README.md RELEASE_v0.36.1.md dist/BUILD-LIMITATIONS.txt
          unzip -tq dist/Project-Ember-v0.38.2-source.zip

      - name: Upload source-only archive
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') == '' || hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.38.2-source
          path: dist/Project-Ember-v0.38.2-source.zip
          if-no-files-found: error
          retention-days: 30

      - name: Recover the original Tiny Swords atlas from retained Project Ember packages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import zipfile
          from pathlib import Path

          project = Path("project_ember")
          target_dir = project / "assets/combat/tiny_swords"
          target_dir.mkdir(parents=True, exist_ok=True)
          expected = {
              "combat_units_atlas.png": "ee07ed04f8856859af89590f3412b5865959d9ac19bd2f669268778eed45cf00",
              "atlas_manifest.json": "ff3b8b74ccf36c4c1cbc3d800acae42a9bbf047c774689fbec39073e81e95c2b",
          }
          archives = sorted(Path(".").glob("*.zip"))
          found = {}
          for archive_path in archives:
              try:
                  with zipfile.ZipFile(archive_path) as archive:
                      for member in archive.namelist():
                          base = Path(member).name
                          if base not in expected or base in found:
                              continue
                          data = archive.read(member)
                          digest = hashlib.sha256(data).hexdigest()
                          if digest == expected[base]:
                              destination = target_dir / base
                              destination.write_bytes(data)
                              found[base] = (str(archive_path), member, digest, len(data))
                              print(f"RECOVERED {base} from {archive_path}:{member} ({len(data)} bytes)")
              except (zipfile.BadZipFile, OSError) as exc:
                  print(f"SKIP {archive_path}: {exc}")
          for name in expected:
              if name not in found and (target_dir / name).is_file():
                  data = (target_dir / name).read_bytes()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest == expected[name]:
                      found[name] = ("checkout", str(target_dir / name), digest, len(data))
          if len(found) == len(expected):
              Path("tiny-swords-recovery.txt").write_text(
                  "\\n".join(f"{name}: {value[0]} / {value[1]} / sha256={value[2]}" for name, value in found.items()) + "\\n",
                  encoding="utf-8",
              )
              print("RECOVERY RESULT: both manifest-matched assets are available.")
          else:
              missing = sorted(set(expected) - set(found))
              print("RECOVERY RESULT: still missing: " + ", ".join(missing))
              Path("tiny-swords-recovery.txt").write_text(
                  "Missing from all tracked repository ZIP archives: " + ", ".join(missing) + "\\n",
                  encoding="utf-8",
              )
          PY

      - name: Assemble complete playable ZIP
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') != '' && hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          bash project_ember/tools/assets/package_playable_release.sh "$PWD/dist/Project-Ember-v0.38.2.zip"
          cp tiny-swords-recovery.txt dist/TINY-SWORDS-ASSET-RECOVERY.txt

      - name: Upload complete playable ZIP
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') != '' && hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.38.2-playable
          path: |
            dist/Project-Ember-v0.38.2.zip
            dist/TINY-SWORDS-ASSET-RECOVERY.txt
          if-no-files-found: error
          retention-days: 30

      - name: Explain why source-only checkout cannot produce a playable archive
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') == '' || hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') == '' }}
        run: |
          echo "Playable pixel-art atlas is absent. Public source intentionally excludes licensed sprite binaries."
          echo "No misleading low-poly fallback archive will be uploaded."
          echo "Build the integrated game ZIP locally with project_ember/tools/assets/package_playable_release.sh."

      - name: Upload playable pixel-art Godot project
        if: ${{ hashFiles('project_ember/assets/combat/tiny_swords/combat_units_atlas.png') != '' && hashFiles('project_ember/assets/combat/tiny_swords/atlas_manifest.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.38.2
          path: |
            project_ember/**
            !project_ember/.godot/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
