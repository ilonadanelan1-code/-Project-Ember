name: Package Project Ember Android ZIP

on:
  push:
    branches: [main]
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate Godot project
        run: |
          test -f project_ember/project.godot
          test -d project_ember/scenes
          test -d project_ember/scripts
      - name: Upload ready-to-open Godot project
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.5.1
          path: project_ember/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
