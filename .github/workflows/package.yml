name: Validate and package Project Ember

on:
  push:
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  pull_request:
    branches: [main]
    paths:
      - "project_ember/**"
      - ".github/workflows/package.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
      - name: Validate project structure
        run: |
          test -f project_ember/project.godot
          test -d project_ember/scenes
          test -d project_ember/scripts
          test -f project_ember/tests/campaign_smoke_test.gd
          test -f project_ember/tests/unit_roster_smoke_test.gd
          test -f project_ember/tests/hero_progression_smoke_test.gd
          test -f project_ember/tests/visual_overhaul_smoke_test.gd
          test -f project_ember/tests/foundation_smoke_test.gd
          test -f project_ember/scripts/art_palette.gd
          test -f project_ember/scripts/ui_theme.gd
          test -f project_ember/scripts/game_settings.gd
          test -f project_ember/scripts/perf_overlay.gd
          test -f project_ember/scripts/visual_cache.gd
          test -f project_ember/scripts/settings_panel.gd
          test -f project_ember/scripts/battlefield_visuals.gd
          test -f project_ember/scripts/battle_unit_visuals.gd
          test -f project_ember/scripts/unit_catalog.gd
      - name: Import and parse all Godot scripts (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --editor --path project_ember --quit 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during import." >&2
            exit 1
          fi
      - name: Smoke-test strategic map startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --quit-after 10 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file"; then
            echo "Godot reported an engine or script error during strategic startup." >&2
            exit 1
          fi
      - name: Smoke-test tactical battle startup (fail on engine errors)
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember res://scenes/combat_test.tscn --quit-after 10 2>&1 | tee "$log_file"
          # Godot 4.3 has a confirmed dummy-renderer shutdown bug that emits
          # "Parameter \"m\" is null" for MeshInstance3D in headless mode.
          # Ignore only that exact engine signature; all other errors still fail CI.
          reported_errors="$(grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:' "$log_file" | grep -Fv 'ERROR: Parameter "m" is null.' || true)"
          if [ -n "$reported_errors" ]; then
            printf '%s\n' "$reported_errors" >&2
            echo "Godot reported an unexpected engine or script error during tactical startup." >&2
            exit 1
          fi
      - name: Test campaign economy, recruitment, expansion and persistence
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/campaign_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Campaign logic tests reported an error." >&2
            exit 1
          fi
      - name: Test unit roster, unlocks and combat profiles
        shell: bash
        run: |
          set -euo pipefail
          log_file="$RUNNER_TEMP/unit_roster_smoke_test.log"
          set +e
          timeout --signal=TERM --kill-after=5s 30s godot --headless --path project_ember --script res://tests/unit_roster_smoke_test.gd --quit-after 300 2>&1 | tee "$log_file"
          godot_status=${PIPESTATUS[0]}
          set -e
          if [ "$godot_status" -ne 0 ]; then
            echo "Unit roster Godot process exited with status $godot_status." >&2
          fi
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Unit roster tests reported an error." >&2
            exit 1
          fi
          if [ "$godot_status" -ne 0 ] || ! grep -Fq "All unit roster smoke tests passed." "$log_file"; then
            echo "Unit roster test did not reach its success marker." >&2
            exit 1
          fi
      - name: Upload unit roster diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Unit-Roster-Diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/unit_roster_smoke_test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Test hero progression and commander abilities
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/hero_progression_smoke_test.gd 2>&1 | tee "$log_file"
          # Godot 4.3 dummy-renderer shutdown can emit the same confirmed
          # MeshInstance3D cleanup warning seen in the tactical startup test.
          # Ignore only that exact signature; all script and test errors still fail CI.
          reported_errors="$(grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file" | grep -Fv 'ERROR: Parameter "m" is null.' || true)"
          if [ -n "$reported_errors" ]; then
            printf '%s\\n' "$reported_errors" >&2
            echo "Hero progression tests reported an unexpected error." >&2
            exit 1
          fi
      - name: Test battlefield visuals and 50-unit mesh/node/material budget
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/visual_overhaul_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file" | grep -Fv 'ERROR: Parameter "m" is null.'; then
            echo "Visual builder tests reported an unexpected error." >&2
            exit 1
          fi
      - name: Test Foundation settings, Theme and resource cache
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          godot --headless --path project_ember --script res://tests/foundation_smoke_test.gd 2>&1 | tee "$log_file"
          if grep -En 'SCRIPT ERROR:|Parse Error:|ERROR:|TEST FAILED:' "$log_file"; then
            echo "Foundation tests reported an error." >&2
            exit 1
          fi
      - name: Upload ready-to-open Godot project
        uses: actions/upload-artifact@v4
        with:
          name: Project-Ember-v0.9.1-Units
          path: |
            project_ember/**
            !project_ember/.godot/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
